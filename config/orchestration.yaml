schema_version: 1
mode: task_driven
max_parallel_agents: 3
limits:
  automatic_correction_cycles: 2
  environment_retries: 1
  integration_attempts: 2
  evidence_requests: 1
  tasks_per_hu_without_human_review: 20
  repeated_failure_fingerprint: 2
  analysis_initial_search_rounds: 1
  analysis_starting_identifiers: 3
  analysis_initial_file_budget: 10
  analysis_dependency_hops: 1
  analysis_scope_expansions_without_approval: 0
  analysis_scope_expansion_confirmations: 2
states:
  - PENDING
  - READY
  - IN_PROGRESS
  - REVIEW
  - CORRECTION_REQUIRED
  - WAITING_APPROVAL
  - BLOCKED
  - DONE
  - CANCELLED
rules:
  completed_tasks_are_immutable: true
  correction_requires_child_task: true
  same_file_parallel_writes: false
  external_mutations_are_serialized: true
  session_start_is_read_only: true
  session_start_is_idempotent: true
  interrupted_task_resume_is_manual: true
  skill_changes_apply_after_hu_close: true
  analysis_requires_confirmed_exploration_contract: true
  confluence_write_requires_explicit_canonical_target: true
  confluence_write_confirmation_is_single_use: true
